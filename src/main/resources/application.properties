spring.application.name=ecet-desk-api

# Database credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecet_desk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the database schema. Do not use Hibernate schema generation.
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep operational endpoints small and safe.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

server.port=${PORT:8080}
