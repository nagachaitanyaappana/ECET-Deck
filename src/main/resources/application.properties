spring.application.name=ecet-desk-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/ecet_desk}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=app
spring.datasource.hikari.connection-init-sql=SET search_path TO app, public
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.options=-c search_path=app,public
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
server.port=${PORT:8080}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:43200}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.display-name=${BOOTSTRAP_ADMIN_NAME:}
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.mail.brevo.sender-name=${BREVO_SENDER_NAME:Paradox}
app.security.settings-encryption-key-base64=${SETTINGS_ENCRYPTION_KEY_BASE64:}
app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:paradoxofficial2008@gmail.com}
app.auth.otp-expiry-minutes=${AUTH_OTP_EXPIRY_MINUTES:10}
app.auth.otp-resend-seconds=${AUTH_OTP_RESEND_SECONDS:60}
app.auth.login-notifications-enabled=${AUTH_LOGIN_NOTIFICATIONS_ENABLED:true}
