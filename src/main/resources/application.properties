spring.application.name=ecet-desk-api
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecet_desk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=app
spring.datasource.hikari.connection-init-sql=SET search_path TO app, public
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
server.port=${PORT:8080}
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:720}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.display-name=${BOOTSTRAP_ADMIN_NAME:}
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.security.settings-encryption-key-base64=${SETTINGS_ENCRYPTION_KEY_BASE64:}
# Configure SMTP credentials in .env / deployment secrets. Do not commit them.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
app.auth.otp-expiry-minutes=${AUTH_OTP_EXPIRY_MINUTES:10}
app.auth.otp-resend-seconds=${AUTH_OTP_RESEND_SECONDS:60}
app.auth.login-notifications-enabled=${AUTH_LOGIN_NOTIFICATIONS_ENABLED:true}
