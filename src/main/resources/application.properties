spring.application.name=ecet-desk-api

# Load .env from the process working directory (project root when run with Maven).
# The .env file uses Java properties syntax: KEY=value.
spring.config.import=optional:file:.env[.properties]

# Database credentials come from .env locally or deployment environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecet_desk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=app
spring.datasource.hikari.connection-init-sql=SET search_path TO app, public

# Flyway owns the database schema. Do not use Hibernate schema generation.
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep operational endpoints small and safe.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

server.port=${PORT:8080}

# JWT signing key: Base64-encoded random secret (minimum 256 bits).
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:720}

# Optional one-time first-admin bootstrap. Set all three values in .env.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.display-name=${BOOTSTRAP_ADMIN_NAME:}

app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
