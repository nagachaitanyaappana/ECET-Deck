name: Backend CI

on:
  push:
    paths:
      - "**/*.java"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.java"
      - "pom.xml"
      - "src/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
